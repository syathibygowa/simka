# SIMKA PRO | supabase/config.toml | v1.1 | Fase 3 – Tahap 1 Pengumuman, audit log, notifikasi HP | 04/10/2026
# SIMKA PRO · konfigurasi Supabase CLI (bagian Edge Functions)
# Fungsi publik (tanpa JWT pengguna) diberi verify_jwt = false; pemeriksaan
# kewenangan dilakukan di dalam fungsi.
[functions.masuk]
verify_jwt = false

[functions.daftar]
verify_jwt = false

[functions.reset-sandi]
verify_jwt = false

[functions.kelola-akun]
verify_jwt = true

[functions.salin-logo]
verify_jwt = true

[functions.presensi]
verify_jwt = true

[functions.berkas]
verify_jwt = true

# Dipanggil database (pg_net) dengan token internal x-simka-token
[functions.dorong]
verify_jwt = false
