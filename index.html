<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C7332F" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./ikon.svg" />
    <title>SIMKA PRO – Imam Asy-Syathiby</title>
    <script>
      // Terapkan tema sebelum halaman tampil agar tidak berkedip.
      (function () {
        var p = 'sistem';
        try { p = localStorage.getItem('simka.tema') || 'sistem'; } catch (e) {}
        var gelap = p === 'gelap' || (p === 'sistem' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (gelap) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
